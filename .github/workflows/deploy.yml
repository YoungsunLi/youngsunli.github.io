# GitHub Actions 自动部署
#
# 需在仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
# 推送 docs 分支即自动构建发布。
name: Deploy to GitHub Pages

on:
  push:
    branches: [docs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 博客与主题并排检出，还原 package.json 中 file:../vitepress-theme-concise 的相对路径
      - name: Checkout blog
        uses: actions/checkout@v4
        with:
          path: blog
          fetch-depth: 0 # 文章发布日期取自 git 首次提交时间，需要完整历史

      - name: Checkout theme
        uses: actions/checkout@v4
        with:
          repository: YoungsunLi/vitepress-theme-concise
          path: vitepress-theme-concise

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog/package-lock.json

      # 主题以源码形式被引用，需在其目录安装依赖后才能由 Vite 编译
      - name: Install theme deps
        working-directory: vitepress-theme-concise
        run: npm ci

      - name: Install
        working-directory: blog
        run: npm ci

      - name: Build
        working-directory: blog
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blog/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
